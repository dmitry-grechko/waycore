repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length", "100"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: ["--fix", "--unsafe-fixes"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2
          - types-PyYAML
          - fastapi>=0.115
          - uvicorn>=0.30
        args:
          [
            "--strict",
            "--explicit-package-bases",
            "--python-version=3.11",
            "--show-error-codes",
            "--pretty",
            "--exclude",
            "^(progress/|scripts/|device/.*/tests/|device/drivers/|device/apps/ui/|device/apps/core/app_bridge\\.py$|device/.+/__init__\\.py$)",
            "device",
          ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  # Local hooks for project-specific tasks
  - repo: local
    hooks:
      - id: generate-openapi
        name: Generate OpenAPI specs
        entry: poetry run python scripts/generate-openapi.py
        language: system
        pass_filenames: false
        # Only trigger on API source files, not generated output
        files: ^device/services/.*/api\.py$
        # Exclude the generated spec files from triggering re-runs
        exclude: ^docs/api/
